name: Package with Velopack

# Reusable workflow that packages build artifacts with Velopack.
# Expects build artifacts from the build.yml workflow.

on:
    workflow_call:
        inputs:
            version:
                description: "Version string for the package"
                required: true
                type: string
            channel:
                description: "Velopack channel (stable or dev)"
                required: true
                type: string
        outputs:
            artifact-name:
                description: "Name of the uploaded release artifact"
                value: ${{ jobs.package.outputs.artifact-name }}

env:
    VELOPACK_APP_ID: synodic
    VELOPACK_APP_TITLE: Synodic Client
    VELOPACK_TARGETS: |
        build-windows-x64:synodic.exe
        build-linux-x64:synodic
        build-macos-x64:synodic

jobs:
    package:
        runs-on: ubuntu-latest
        outputs:
            artifact-name: velopack-releases
        steps:
            - name: Download all build artifacts
              uses: actions/download-artifact@v4
              with:
                  path: builds

            - name: Install Velopack CLI
              run: dotnet tool install -g vpk

            - name: Download previous release (for delta packages)
              continue-on-error: true
              run: |
                  vpk download github \
                    --repoUrl https://github.com/${{ github.repository }} \
                    --channel ${{ inputs.channel }} \
                    --token ${{ secrets.GITHUB_TOKEN }}

            - name: Install libfuse2 for AppImage
              run: |
                  sudo apt-get update
                  sudo apt-get install -y libfuse2

            - name: Create Velopack packages
              shell: bash
              run: |
                  set -euo pipefail

                  mkdir -p releases
                  package_count=0

                  while IFS=':' read -r artifact_dir main_exe; do
                    [ -n "${artifact_dir}" ] || continue

                    pack_dir="builds/${artifact_dir}"

                    if [ ! -d "${pack_dir}" ]; then
                      continue
                    fi

                    vpk pack \
                      --packId ${{ env.VELOPACK_APP_ID }} \
                      --packVersion ${{ inputs.version }} \
                      --packDir "${pack_dir}" \
                      --mainExe "${main_exe}" \
                      --packTitle "${{ env.VELOPACK_APP_TITLE }}" \
                      --channel ${{ inputs.channel }} \
                      --outputDir releases
                    package_count=$((package_count + 1))
                  done <<< "${{ env.VELOPACK_TARGETS }}"

                  if [ "${package_count}" -eq 0 ]; then
                    echo "No build artifacts found to package." >&2
                    exit 1
                  fi

                  ls -la releases/

            - name: Upload release artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: velopack-releases
                  path: releases/*
