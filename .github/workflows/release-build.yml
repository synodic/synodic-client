name: Release Build

# Builds and publishes stable releases to GitHub Releases using Velopack.
# Triggered by published releases or manual dispatch.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag"
        required: true
        type: string

permissions:
  contents: write

jobs:
  get-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Get version
        id: version
        run: |
          if [ "${{ github.event_name }}" == "release" ]; then
            VERSION="${{ github.event.release.tag_name }}"
          else
            VERSION="${{ inputs.version }}"
          fi
          # Strip leading 'v' if present
          VERSION="${VERSION#v}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tag=v${VERSION}" >> $GITHUB_OUTPUT

  build:
    needs: get-version
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.get-version.outputs.version }}

  package:
    needs: [get-version, build]
    uses: ./.github/workflows/package.yml
    with:
      version: ${{ needs.get-version.outputs.version }}
      channel: stable

  release:
    needs: [get-version, package]
    runs-on: ubuntu-latest
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: velopack-releases
          path: releases

      # For releases triggered by release event
      - name: Upload to existing release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: releases/*

      # For manual workflow_dispatch
      - name: Create release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.get-version.outputs.tag }}
          name: "Release ${{ needs.get-version.outputs.version }}"
          draft: true
          files: releases/*
          body: |
            **Release ${{ needs.get-version.outputs.version }}**

            ## Installation
            - **Windows**: Download `synodic-Setup.exe` and run it
            - **Linux**: Download the `.AppImage` file, make it executable with `chmod +x`, and run
            - **macOS**: Download and extract the package
